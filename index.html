<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMARC Billar POS</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#0b211b;color:#f2fff6;margin:0}header,nav{background:#143e30;padding:15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}main{max-width:1100px;margin:auto;padding:15px}button{background:#1b9861;color:white;border:0;border-radius:9px;padding:11px;margin:3px;cursor:pointer}button.red{background:#ae3b46}button.gold{background:#ae812b}input,select{padding:10px;border-radius:7px;border:1px solid #507764;background:#153b2e;color:white;max-width:100%}.card{background:#194332;border:1px solid #36654e;border-radius:14px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.grid .card{margin:0}.busy{background:#57362b}.due{background:#5d501f}.off{background:#39403e}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:#b7d0bf}.price{font-size:26px;color:#f7d782;font-weight:800}h1,h2{margin:6px 0 12px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #46735c;text-align:left}@media print{header,nav,button{display:none!important}body{background:white;color:black}.card{border:0;background:white;color:black}}</style><header><h1 id="brand">🎱 POOL ZONE</h1><span>RMARC · Punto de venta para billar</span></header><nav><button onclick="page='mesas';selected=null;draw()">🎱 Mesas</button><button onclick="page='rapida';draw()">⚡ Venta rápida</button><button onclick="page='productos';draw()">📦 Inventario</button><button onclick="page='ventas';draw()">🧾 Ventas</button><button onclick="page='reportes';draw()">📊 Reportes</button><button onclick="page='ajustes';draw()">⚙️ Configuración</button></nav><main id="app"></main><script>
const KEY='rmarc_billar_pos_2026';let db;const initial=()=>({name:'POOL ZONE',rate:60,next:9,pid:5,tables:Array.from({length:8},(_,i)=>({id:i+1,name:'Mesa '+(i+1),state:'free',started:0,elapsed:0,items:[]})),products:[{id:1,name:'Refresco',price:25,stock:30},{id:2,name:'Agua',price:15,stock:30},{id:3,name:'Papas',price:25,stock:20},{id:4,name:'Cerveza',price:30,stock:20}],sales:[]});try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}let page='mesas',selected=null,cart=[],ticket=null;let adminToken=sessionStorage.getItem('billar_admin_token')||'',syncToken=sessionStorage.getItem('billar_sync_token')||'',syncRevision=null,syncBusy=false,syncReady=false;const $=id=>document.getElementById(id),fmt=n=>'$'+Number(n||0).toFixed(2),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));queueSync()},table=id=>db.tables.find(t=>t.id===id),product=id=>db.products.find(p=>p.id===id),ms=t=>t.elapsed+(t.started?Date.now()-t.started:0),clock=t=>{let n=Math.floor(ms(t)/1000);return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,'0')).join(':')},timeCost=t=>Math.round(ms(t)/3600000*db.rate*100)/100,itemsCost=a=>a.reduce((s,x)=>s+x.qty*x.price,0),btn=(label,code,cls='')=>`<button class="${cls}" onclick="${code}">${label}</button>`;
function draw(){ $('brand').textContent='🎱 '+db.name;if(ticket){$('app').innerHTML=ticketHtml();return}let a=$('app');a.innerHTML=page==='mesas'?mesas():page==='rapida'?rapida():page==='productos'?productos():page==='ventas'?ventas():page==='reportes'?reportes():ajustes()}
function mesas(){if(selected!==null)return detail(table(selected));let counts=['free','busy','due','off'].map(s=>db.tables.filter(t=>t.state===s).length);return `<div class="grid">${['Libres','Ocupadas','Por cobrar','Fuera'].map((x,i)=>`<div class="card"><div class="price">${counts[i]}</div>${x}</div>`).join('')}</div><div class="row"><h2>Control de mesas</h2>${btn('+ Agregar mesa','addTable()')}</div><div class="grid">${db.tables.map(t=>`<div class="card ${t.state}"><h2>🎱 ${esc(t.name)}</h2><p>${{free:'LIBRE',busy:'OCUPADA',due:'POR COBRAR',off:'FUERA DE SERVICIO'}[t.state]}</p><p>${t.state==='busy'||t.state==='due'?clock(t):'Disponible'}</p>${btn('Abrir mesa',`selected=${t.id};draw()`)}</div>`).join('')}</div>`}
function addTable(){db.tables.push({id:db.next,name:'Mesa '+db.next,state:'free',started:0,elapsed:0,items:[]});db.next++;save();draw()}
function detail(t){let cost=timeCost(t),subtotal=itemsCost(t.items);return `<div class="card"><div class="row"><h2>${esc(t.name)}</h2>${btn('← Regresar','selected=null;draw()')}</div><p class="price">⏱️ <span id="clock">${clock(t)}</span></p><p>Tarifa: ${fmt(db.rate)} por hora · Tiempo: ${fmt(cost)}</p>${t.state==='free'?btn('▶ Iniciar tiempo',`start(${t.id})`):''}${t.state==='busy'?btn('⏸ Detener tiempo',`stop(${t.id})`,'gold'):''}${t.state==='due'?btn('▶ Reanudar',`resume(${t.id})`):''}${['free','off'].includes(t.state)?btn(t.state==='off'?'Habilitar':'Fuera de servicio',`toggle(${t.id})`):''}</div><div class="card"><h2>Agregar consumos</h2><div class="grid">${db.products.map(p=>`<div class="card"><b>${esc(p.name)}</b><p>${fmt(p.price)} · Stock: ${p.stock}</p>${btn('+ Agregar',`addItem(${t.id},${p.id})`)}</div>`).join('')}</div></div><div class="card"><h2>Cuenta</h2>${t.items.map(x=>`<div class="row"><span>${esc(x.name)} × ${x.qty} — ${fmt(x.qty*x.price)}</span>${btn('−',`removeItem(${t.id},${x.id})`)}</div>`).join('')||'Sin consumos'}<hr><div class="row"><span>Tiempo: ${fmt(cost)} · Productos: ${fmt(subtotal)}</span><span class="price">${fmt(cost+subtotal)}</span></div>${t.state==='due'||(t.state==='free'&&t.items.length)?btn('💳 Cobrar mesa',`checkout('mesa',${t.id})`):''}${btn('Renombrar',`rename(${t.id})`)}${btn('Eliminar mesa',`delTable(${t.id})`,'red')}</div>`}
function start(id){let t=table(id);t.started=Date.now();t.state='busy';save();draw()}function stop(id){let t=table(id);t.elapsed=ms(t);t.started=0;t.state='due';save();draw()}function resume(id){let t=table(id);t.started=Date.now();t.state='busy';save();draw()}function toggle(id){let t=table(id);t.state=t.state==='off'?'free':'off';save();draw()}function rename(id){let t=table(id),v=prompt('Nombre de la mesa',t.name);if(v?.trim()){t.name=v.trim();save();draw()}}function delTable(id){let t=table(id);if(t.state==='busy'||t.state==='due'||t.items.length)return alert('Primero termina y cobra la cuenta');if(confirm('¿Eliminar mesa?')){db.tables=db.tables.filter(t=>t.id!==id);selected=null;save();draw()}}
function addItem(tid,pid){let t=table(tid),p=product(pid);if(p.stock<=0)return alert('Sin existencias');let x=t.items.find(x=>x.id===pid);if(x)x.qty++;else t.items.push({id:pid,name:p.name,price:p.price,qty:1});p.stock--;save();draw()}function removeItem(tid,pid){let t=table(tid),x=t.items.find(x=>x.id===pid);if(!x)return;let p=product(pid);if(p)p.stock++;x.qty--;if(!x.qty)t.items=t.items.filter(i=>i.id!==pid);save();draw()}
function rapida(){return `<div class="card"><h2>⚡ Venta rápida sin mesa</h2><div class="grid">${db.products.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${fmt(p.price)} · Stock ${p.stock}</p>${btn('+ Agregar',`quickAdd(${p.id})`)}</div>`).join('')}</div></div><div class="card"><h2>Carrito</h2>${cart.map(x=>`<div class="row"><span>${esc(x.name)} × ${x.qty} — ${fmt(x.price*x.qty)}</span>${btn('−',`quickRemove(${x.id})`)}</div>`).join('')||'Sin productos'}<hr><div class="row"><span class="price">Total: ${fmt(itemsCost(cart))}</span><span>${btn('Limpiar','cart=[];draw()','red')}${btn('Cobrar y generar ticket',"checkout('rapida')")}</span></div></div>`}function quickAdd(id){let p=product(id),x=cart.find(x=>x.id===id);if((x?.qty||0)>=p.stock)return alert('Sin existencias');if(x)x.qty++;else cart.push({id,name:p.name,price:p.price,qty:1});draw()}function quickRemove(id){let x=cart.find(x=>x.id===id);if(x){x.qty--;if(!x.qty)cart=cart.filter(y=>y.id!==id)}draw()}
function checkout(kind,id){let t=kind==='mesa'?table(id):null,items=(t?t.items:cart).map(x=>({...x})),cost=t?timeCost(t):0,total=cost+itemsCost(items);if(total<=0)return alert('Cuenta vacía');let method=prompt('Forma de pago: 1 Efectivo, 2 Tarjeta, 3 Transferencia','1');if(!['1','2','3'].includes(method))return;let received=total;if(method==='1'){let v=prompt('Total '+fmt(total)+'\nEfectivo recibido:',String(total));if(v===null)return;received=Number(v);if(!Number.isFinite(received)||received<total)return alert('El pago es insuficiente')}if(!confirm('Confirmar cobro de '+fmt(total)+'?'))return;if(t){t.state='free';t.elapsed=0;t.started=0;t.items=[]}else{for(let x of cart)product(x.id).stock-=x.qty;cart=[]}ticket={id:Date.now(),date:new Date().toISOString(),mesa:t?t.name:'Venta rápida',items,time:cost,total,method:{1:'Efectivo',2:'Tarjeta',3:'Transferencia'}[method],received,change:received-total};db.sales.push(ticket);save();selected=null;draw()}
function ticketHtml(){let s=ticket;return `<div class="card" style="max-width:550px;margin:auto"><h2>🧾 ${esc(db.name)}</h2><p>${new Date(s.date).toLocaleString('es-MX')} · ${esc(s.mesa)}</p>${s.items.map(x=>`<div class="row"><span>${esc(x.name)} × ${x.qty}</span><span>${fmt(x.qty*x.price)}</span></div>`).join('')}<div class="row"><span>Tiempo</span><span>${fmt(s.time)}</span></div><hr><p class="price">TOTAL ${fmt(s.total)}</p><p>${s.method} · Recibido ${fmt(s.received)} · Cambio ${fmt(s.change)}</p>${btn('🖨️ Imprimir / Guardar PDF','window.print()')}${btn('Volver al punto de venta',"ticket=null;page='mesas';draw()")}</div>`}
function productos(){return !adminToken?`<div class="card"><h2>🔒 Inventario protegido</h2><p>Para modificar productos, ingresa la contraseña de administrador.</p><input id="adminPass" type="password" placeholder="Contraseña">${btn('Entrar', 'adminLogin()')}</div><div class="card">${db.products.map(p=>`<p>${esc(p.name)} · ${fmt(p.price)} · Existencias: ${p.stock}</p>`).join('')}</div>`:`<div class="card"><h2>📦 Productos e inventario</h2><form onsubmit="addProduct(event)"><input name="name" placeholder="Nombre del producto" required><input name="price" type="number" step=".01" min="0" placeholder="Precio" required><input name="stock" type="number" min="0" placeholder="Existencias" required><button>+ Agregar producto</button></form></div><div class="card">${db.products.map(p=>`<div class="row"><span><b>${esc(p.name)}</b><br>${fmt(p.price)} · Existencias: ${p.stock}</span><span>${btn('Editar',`editProduct(${p.id})`)}${btn('Eliminar',`delProduct(${p.id})`,'red')}</span></div><hr>`).join('')}</div>`}function addProduct(e){if(!adminToken)return alert('Acceso de administrador requerido');e.preventDefault();let f=new FormData(e.target);db.products.push({id:db.pid++,name:String(f.get('name')),price:Number(f.get('price')),stock:Number(f.get('stock'))});save();draw()}function editProduct(id){if(!adminToken)return alert('Acceso de administrador requerido');let p=product(id),n=prompt('Nombre',p.name);if(!n?.trim())return;let price=prompt('Precio',p.price);if(price===null||Number(price)<0||!Number.isFinite(Number(price)))return;let stock=prompt('Existencias',p.stock);if(stock===null||Number(stock)<0||!Number.isInteger(Number(stock)))return;Object.assign(p,{name:n.trim(),price:Number(price),stock:Number(stock)});save();draw()}function delProduct(id){if(!adminToken)return alert('Acceso de administrador requerido');if(confirm('¿Eliminar producto?')){db.products=db.products.filter(p=>p.id!==id);save();draw()}}
function ventas(){return `<div class="card"><h2>🧾 Historial de ventas</h2><div style="overflow:auto"><table><tr><th>Fecha</th><th>Mesa</th><th>Pago</th><th>Total</th><th>Ticket</th></tr>${db.sales.slice().reverse().map(s=>`<tr><td>${new Date(s.date).toLocaleString('es-MX')}</td><td>${esc(s.mesa)}</td><td>${s.method}</td><td>${fmt(s.total)}</td><td>${btn('Ver',`ticket=db.sales.find(x=>x.id===${s.id});draw()`)}</td></tr>`).join('')}</table></div></div>`}
function reportes(){let today=new Date().toDateString(),list=db.sales.filter(s=>new Date(s.date).toDateString()===today),sum=a=>a.reduce((s,x)=>s+x.total,0);return `<div class="card"><h2>📊 Corte diario y reportes</h2><div class="grid"><div class="card">Ventas hoy<h2>${list.length}</h2></div><div class="card">Ingreso hoy<h2>${fmt(sum(list))}</h2></div><div class="card">Histórico<h2>${fmt(sum(db.sales))}</h2></div></div>${['Efectivo','Tarjeta','Transferencia'].map(m=>`<div class="row"><span>${m}</span><b>${fmt(sum(list.filter(s=>s.method===m)))}</b></div>`).join('')}${btn('Exportar CSV','exportCSV()')}${btn('Limpiar ventas de prueba','clearSales()','red')}</div>`}function clearSales(){if(!adminToken)return alert('Acceso de administrador requerido');if(prompt('Escribe BORRAR para eliminar todas las ventas')==='BORRAR'){db.sales=[];save();draw()}}function exportCSV(){let rows=[['Fecha','Mesa','Pago','Total'],...db.sales.map(s=>[s.date,s.mesa,s.method,s.total])],a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='ventas_rmarc.csv';a.click()}
function ajustes(){return !adminToken?`<div class="card"><h2>🔒 Configuración protegida</h2><input id="adminPass" type="password" placeholder="Contraseña">${btn('Entrar','adminLogin()')}</div>`:`<div class="card"><h2>⚙️ Configuración y respaldo</h2><form onsubmit="config(event)"><label>Nombre del billar <input name="name" value="${esc(db.name)}" required></label><label>Tarifa por hora <input name="rate" type="number" min="0" step=".01" value="${db.rate}" required></label><button>Guardar</button></form><p class="muted">Los datos se guardan en este navegador. Si se borran los datos del navegador, se pierde el historial salvo que tengas un respaldo.</p>${btn('Descargar respaldo','backup()')}<div class="card"><h3>☁️ Sincronización</h3><p class="muted">Versión de conexión: RMARC-251025-B</p><p id="syncStatus">${syncReady?'Conectado':'Sin conectar'}</p>${btn('Conectar dispositivo','connectDevice()')}${btn('Enviar datos de este dispositivo a la nube','uploadInitial()','gold')}${btn('Cerrar sesión administrador','adminLogout()','red')}</div><p>Restaurar respaldo JSON: <input type="file" accept=".json" onchange="restore(event)"></p></div>`}function config(e){if(!adminToken)return alert('Acceso de administrador requerido');e.preventDefault();let f=new FormData(e.target);db.name=String(f.get('name'));db.rate=Number(f.get('rate'));save();draw()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='respaldo_rmarc_billar.json';a.click()}function restore(e){if(!adminToken)return alert('Acceso de administrador requerido');let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tables)||!Array.isArray(d.products)||!Array.isArray(d.sales))throw Error();if(confirm('¿Reemplazar los datos actuales con este respaldo?')){db=d;save();draw()}}catch{alert('Respaldo inválido')}};r.readAsText(f)}
async function api(action,body={},token=syncToken){const r=await fetch('/api/sync',{method:'POST',headers:{'content-type':'application/json',...(token?{'authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...body})});const j=await r.json().catch(()=>({error:'Error de conexión'}));if(!r.ok)throw Error(j.error||'Error de servidor');return j}
async function adminLogin(){let p=$('adminPass')?.value;if(!p)return;try{let x=await api('login',{password:p,role:'admin'});adminToken=x.token;syncToken=x.token;sessionStorage.setItem('billar_admin_token',adminToken);sessionStorage.setItem('billar_sync_token',syncToken);draw();await pollSync()}catch(e){alert(e.message)}}
function adminLogout(){adminToken='';sessionStorage.removeItem('billar_admin_token');draw()}
async function connectDevice(){
 // Solo se conecta con una sesión administrativa vigente o una nueva autenticación explícita.
 try{
  let token=adminToken;
  if(!token){
   const password=prompt('Contraseña de administrador para conectar este dispositivo');
   if(!password)return;
   const response=await api('login',{password,role:'admin'},'');
   token=response.token;
   adminToken=token;
   sessionStorage.setItem('billar_admin_token',token);
  }
  // Comprobar el token contra el servidor antes de declarar conexión.
  const x=await api('read',{},token);
  syncToken=token;
  sessionStorage.setItem('billar_sync_token',token);
  if(x.data){
   // No reemplazar datos locales automáticamente: pueden contener ventas no respaldadas.
   syncRevision=x.revision;
   syncReady=false;
   alert('Acceso a la nube confirmado. Hay datos en la nube. Por seguridad no se reemplazaron los datos de este teléfono. Descarga un respaldo antes de continuar.');
  }else{
   syncReady=false;
   alert('Acceso a la nube confirmado. Todavía no hay datos iniciales en la nube. Descarga el respaldo JSON del teléfono principal antes de enviar datos.');
  }
  draw();
 }catch(e){alert('No se pudo conectar: '+e.message)}
}
async function uploadInitial(){if(!adminToken)return alert('Requiere administrador');if(!confirm('Esto enviará el respaldo de ESTE dispositivo a la nube. Hazlo primero desde la tablet principal, después de descargar su respaldo. Si ya hay datos en la nube, NO se reemplazarán. ¿Continuar?'))return;try{let x=await api('bootstrap',{data:db},adminToken);syncRevision=x.revision;syncReady=true;alert('Datos iniciales cargados correctamente')}catch(e){alert(e.message)}}
let pendingSync=false;
function queueSync(){if(!syncToken||!syncReady)return;pendingSync=true;setTimeout(flushSync,250)}
async function flushSync(){if(syncBusy||!pendingSync||!syncReady)return;syncBusy=true;pendingSync=false;try{let x=await api('write',{data:db,revision:syncRevision});syncRevision=x.revision}catch(e){syncReady=false;pendingSync=true;alert('No se pudo sincronizar. Los cambios permanecen guardados en este dispositivo. '+e.message)}finally{syncBusy=false}}
async function pollSync(){if(!syncToken||syncBusy||pendingSync)return;try{let x=await api('read');if(x.data&&x.revision!==syncRevision){db=x.data;localStorage.setItem(KEY,JSON.stringify(db));syncRevision=x.revision;syncReady=true;if(!ticket)draw()}else if(!x.data){syncReady=false}}catch(e){syncReady=false}}
setInterval(pollSync,3500);if(syncToken)pollSync();
draw();setInterval(()=>{if(page==='mesas'&&!ticket){if(selected!==null){let x=$('clock');if(x)x.textContent=clock(table(selected))}else if(db.tables.some(t=>t.state==='busy'))draw()}},1000);
</script></html>
